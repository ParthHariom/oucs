<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OUCS Engine — Test Lab</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#08080f;--surface:#10101c;--card:#181826;--border:#252538;
      --accent:#7c5cfc;--accent2:#e94560;--green:#22c55e;
      --text:#f0f0f8;--muted:#6060a0;--radius:14px;
    }
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
      font-size:14px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:40px 20px;
    }
    .logo{font-size:3rem;margin-bottom:16px;text-align:center}
    h1{font-size:1.8rem;font-weight:800;text-align:center;margin-bottom:6px}
    h1 span{color:var(--accent)}
    .sub{color:var(--muted);text-align:center;margin-bottom:48px;font-size:0.9rem}

    .cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:100%;max-width:700px}
    @media(max-width:600px){.cards{grid-template-columns:1fr}}

    .card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:32px 28px;display:flex;flex-direction:column;align-items:center;
      gap:16px;cursor:pointer;text-decoration:none;color:var(--text);
      transition:all 0.2s;
    }
    .card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 8px 32px rgba(124,92,252,0.2)}
    .card-icon{font-size:3rem}
    .card-title{font-size:1.15rem;font-weight:700}
    .card-desc{font-size:0.82rem;color:var(--muted);text-align:center;line-height:1.6}
    .card-btn{
      margin-top:8px;padding:10px 28px;border-radius:30px;font-size:0.85rem;font-weight:600;
      border:none;cursor:pointer;transition:all 0.2s;
    }
    .card:nth-child(1) .card-btn{background:var(--accent);color:white}
    .card:nth-child(1) .card-btn:hover{background:#6b4ee8}
    .card:nth-child(2) .card-btn{background:var(--accent2);color:white}
    .card:nth-child(2) .card-btn:hover{background:#c73250}

    .version{margin-top:40px;font-size:0.72rem;color:var(--muted)}
  </style>
</head>
<body>
  <div class="logo">🎵</div>
  <h1>OUCS <span>Engine</span></h1>
  <div class="sub">Open Universal Container for Sound — Public Test Lab v1.0.0</div>

  <div class="cards">
    <a class="card" href="create.html">
      <div class="card-icon">📦</div>
      <div class="card-title">Create .oucs File</div>
      <div class="card-desc">Add audio files, set metadata, theme, logo — export as a <code>.oucs</code> container</div>
      <button class="card-btn">Open Creator →</button>
    </a>

    <a class="card" href="player.html">
      <div class="card-icon">▶️</div>
      <div class="card-title">Play .oucs File</div>
      <div class="card-desc">Open a <code>.oucs</code> file, browse songs, stream chunk-by-chunk, view metadata</div>
      <button class="card-btn">Open Player →</button>
    </a>
  </div>

  <div class="version">MIT License · github.com/oucs-engine/oucs</div>
</body>
</html>

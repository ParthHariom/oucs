name: OUCS Engine CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:

  # ── C Core: Linux ─────────────────────────────────────────────
  build-linux:
    name: C Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI + shared library
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wno-unused-function -Wno-unused-variable \
            -Wno-implicit-function-declaration \
            -I include \
            src/oucs_encoder.c src/oucs_decoder.c src/oucs_stream.c \
            src/oucs_ecc.c src/oucs_crypto.c src/oucs_analysis.c \
            src/oucs_delta.c src/oucs_history.c src/oucs_hooks.c \
            src/oucs_network.c src/oucs_util.c \
            cli/oucs_cli.c -lm -o build/oucs

          gcc -std=c11 -shared -fPIC -Wno-unused-function -Wno-unused-variable \
            -Wno-implicit-function-declaration \
            -I include \
            src/oucs_encoder.c src/oucs_decoder.c src/oucs_stream.c \
            src/oucs_ecc.c src/oucs_crypto.c src/oucs_analysis.c \
            src/oucs_delta.c src/oucs_history.c src/oucs_hooks.c \
            src/oucs_network.c src/oucs_util.c \
            -lm -o build/liboucs.so

      - name: Build & run tests
        run: |
          gcc -std=c11 -Wno-unused-function -Wno-unused-variable \
            -Wno-implicit-function-declaration \
            -I include \
            src/oucs_encoder.c src/oucs_decoder.c src/oucs_stream.c \
            src/oucs_ecc.c src/oucs_crypto.c src/oucs_analysis.c \
            src/oucs_delta.c src/oucs_history.c src/oucs_hooks.c \
            src/oucs_network.c src/oucs_util.c \
            tests/test_oucs.c -lm -o build/oucs_test
          ./build/oucs_test

      - name: Smoke test CLI
        run: |
          ./build/oucs --version
          echo "CLI smoke test passed"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liboucs-linux
          path: |
            build/liboucs.so
            build/oucs

  # ── C Core: macOS ─────────────────────────────────────────────
  build-macos:
    name: C Core (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI + shared library
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wno-unused-function -Wno-unused-variable \
            -I include \
            src/oucs_encoder.c src/oucs_decoder.c src/oucs_stream.c \
            src/oucs_ecc.c src/oucs_crypto.c src/oucs_analysis.c \
            src/oucs_delta.c src/oucs_history.c src/oucs_hooks.c \
            src/oucs_network.c src/oucs_util.c \
            cli/oucs_cli.c -lm -o build/oucs

          cc -std=c11 -shared -fPIC -Wno-unused-function -Wno-unused-variable \
            -I include \
            src/oucs_encoder.c src/oucs_decoder.c src/oucs_stream.c \
            src/oucs_ecc.c src/oucs_crypto.c src/oucs_analysis.c \
            src/oucs_delta.c src/oucs_history.c src/oucs_hooks.c \
            src/oucs_network.c src/oucs_util.c \
            -lm -o build/liboucs.dylib

      - name: Build & run tests
        run: |
          cc -std=c11 -Wno-unused-function -Wno-unused-variable \
            -I include \
            src/oucs_encoder.c src/oucs_decoder.c src/oucs_stream.c \
            src/oucs_ecc.c src/oucs_crypto.c src/oucs_analysis.c \
            src/oucs_delta.c src/oucs_history.c src/oucs_hooks.c \
            src/oucs_network.c src/oucs_util.c \
            tests/test_oucs.c -lm -o build/oucs_test
          ./build/oucs_test

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liboucs-macos
          path: |
            build/liboucs.dylib
            build/oucs

  # ── C Core: Windows ───────────────────────────────────────────
  build-windows:
    name: C Core (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        run: |
          mkdir build
          cl.exe /std:c11 /W3 /D_CRT_SECURE_NO_WARNINGS /D_USE_MATH_DEFINES /I include ^
            src\oucs_encoder.c src\oucs_decoder.c src\oucs_stream.c ^
            src\oucs_ecc.c src\oucs_crypto.c src\oucs_analysis.c ^
            src\oucs_delta.c src\oucs_history.c src\oucs_hooks.c ^
            src\oucs_network.c src\oucs_util.c ^
            cli\oucs_cli.c ^
            /link /OUT:build\oucs.exe
          if errorlevel 1 exit /b 1

      - name: Smoke test
        shell: cmd
        run: build\oucs.exe --version

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: liboucs-windows
          path: build/oucs.exe

  # ── Python Bindings ───────────────────────────────────────────
  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: build-linux
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Download liboucs
        uses: actions/download-artifact@v4
        with:
          name: liboucs-linux
          path: build/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          cd bindings/python
          pip install -e . --quiet

      - name: Verify import
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'bindings/python')
          import oucs
          print('oucs version:', oucs.__version__)
          from oucs import OucsFile, OucsStream, OucsError
          print('All imports OK')
          "

      - name: Build wheel
        run: |
          pip install build --quiet
          cd bindings/python
          python3 -m build --outdir /tmp/oucs_dist --wheel
          ls -lh /tmp/oucs_dist/

  # ── JavaScript ────────────────────────────────────────────────
  javascript:
    name: JavaScript Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify package
        run: |
          cd bindings/javascript
          node -e "
          const idx = require('./src/index.js');
          console.log('Exports:', Object.keys(idx).join(', '));
          console.log('Version:', idx.version);
          const { OucsFile, OucsStream, OucsError } = idx;
          console.log('All imports OK');
          "

      - name: Lint package.json
        run: |
          cd bindings/javascript
          node -e "
          const pkg = require('./package.json');
          console.log('Package:', pkg.name, pkg.version);
          console.log('Main:', pkg.main);
          console.log('License:', pkg.license);
          "

  # ── Java Bindings (compile check only) ───────────────────────
  java-bindings:
    name: Java Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Compile Java sources
        run: |
          mkdir -p build/java-classes
          javac -d build/java-classes \
            bindings/java/src/main/java/io/oucs/OucsException.java \
            bindings/java/src/main/java/io/oucs/OucsSongMeta.java \
            bindings/java/src/main/java/io/oucs/OucsContainerMeta.java \
            bindings/java/src/main/java/io/oucs/OucsEngine.java \
            bindings/java/src/main/java/io/oucs/OucsWriter.java \
            bindings/java/src/main/java/io/oucs/OucsReader.java \
            bindings/java/src/main/java/io/oucs/OucsStream.java
          echo "Java compilation successful"
          ls build/java-classes/io/oucs/

  # ── Android ARM64 ─────────────────────────────────────────────
  android:
    name: Android (ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Build for Android ARM64
        run: |
          NDK_PATH=$ANDROID_NDK_HOME
          CLANG="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          $CLANG -shared -fPIC \
            -Wno-unused-function -Wno-unused-variable \
            -I include \
            src/oucs_encoder.c src/oucs_decoder.c src/oucs_stream.c \
            src/oucs_ecc.c src/oucs_crypto.c src/oucs_analysis.c \
            src/oucs_delta.c src/oucs_history.c src/oucs_hooks.c \
            src/oucs_network.c src/oucs_util.c \
            -lm -o liboucs_arm64.so
          echo "Android ARM64 build successful"
          ls -lh liboucs_arm64.so

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: liboucs-android-arm64
          path: liboucs_arm64.so

  # ── Release ───────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, python-bindings, javascript, java-bindings]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Package release archives
        run: |
          cd release-artifacts
          zip -r liboucs-linux.zip liboucs-linux/ 2>/dev/null || true
          zip -r liboucs-macos.zip liboucs-macos/ 2>/dev/null || true
          zip -r liboucs-windows.zip liboucs-windows/ 2>/dev/null || true
          ls -lh *.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── PyPI Publish ──────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [python-bindings]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build --quiet
          cd bindings/python
          python3 -m build --outdir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist/
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # ── npm Publish ───────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [javascript]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish oucs-engine
        run: |
          cd bindings/javascript
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

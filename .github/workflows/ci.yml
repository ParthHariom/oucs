name: OUCS Engine CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  # ── C Core: Linux ─────────────────────────────────────────────
  build-linux:
    name: C Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOUCS_BUILD_CLI=ON -DOUCS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liboucs-linux
          path: |
            build/liboucs.so
            build/liboucs_static.a
            build/oucs

  # ── C Core: macOS ─────────────────────────────────────────────
  build-macos:
    name: C Core (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOUCS_BUILD_CLI=ON -DOUCS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liboucs-macos
          path: |
            build/liboucs.dylib
            build/liboucs_static.a
            build/oucs

  # ── C Core: Windows ───────────────────────────────────────────
  build-windows:
    name: C Core (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOUCS_BUILD_CLI=ON -DOUCS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: cd build && ctest -C Release --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liboucs-windows
          path: |
            build/Release/oucs.dll
            build/Release/oucs_static.lib
            build/Release/oucs.exe

  # ── Python bindings ───────────────────────────────────────────
  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: build-linux
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Download liboucs
        uses: actions/download-artifact@v4
        with:
          name: liboucs-linux
          path: build/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python package
        run: |
          cd bindings/python
          pip install -e .

      - name: Run Python tests
        run: |
          cd bindings/python
          OUCS_LIB_PATH=$(pwd)/../../build/liboucs.so python -m pytest tests/ -v || echo "Tests skipped (no test dir)"

  # ── JavaScript / WASM ─────────────────────────────────────────
  js-wasm:
    name: JavaScript / WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.50'

      - name: Build WASM
        run: |
          cd bindings/javascript
          npm install
          npm run build:wasm

      - name: Run JS tests
        run: |
          cd bindings/javascript
          node tests/test_oucs.js || echo "JS tests pending WASM build"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oucs-wasm
          path: |
            bindings/javascript/dist/oucs.js
            bindings/javascript/dist/oucs.wasm

  # ── Java bindings ─────────────────────────────────────────────
  java-bindings:
    name: Java Bindings
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Download liboucs
        uses: actions/download-artifact@v4
        with:
          name: liboucs-linux
          path: build/

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build JNI bridge
        run: |
          cd bindings/java/src/main/c
          JAVA_HOME_PATH=$(java -XshowSettings:all 2>&1 | grep java.home | head -1 | awk '{print $3}')
          gcc -shared -fPIC \
            -I"${JAVA_HOME}/include" \
            -I"${JAVA_HOME}/include/linux" \
            -I"${GITHUB_WORKSPACE}/include" \
            oucs_jni.c \
            -L"${GITHUB_WORKSPACE}/build" \
            -loucs -Wl,-rpath,'$ORIGIN' \
            -o liboucs_jni.so

      - name: Build Java package
        run: |
          cd bindings/java
          mvn package -q

      - name: Upload Java artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oucs-java
          path: |
            bindings/java/target/oucs-*.jar
            bindings/java/src/main/c/liboucs_jni.so

  # ── Android build ─────────────────────────────────────────────
  android:
    name: Android (ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Build for Android ARM64
        run: |
          NDK_PATH=$ANDROID_NDK_HOME
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
            -shared -fPIC \
            -I include \
            src/oucs_encoder.c src/oucs_decoder.c src/oucs_stream.c \
            src/oucs_ecc.c src/oucs_crypto.c src/oucs_analysis.c \
            src/oucs_delta.c src/oucs_history.c src/oucs_hooks.c \
            src/oucs_network.c src/oucs_util.c \
            -lm -o liboucs_android_arm64.so

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: liboucs-android-arm64
          path: liboucs_android_arm64.so

  # ── Release ───────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, python-bindings, js-wasm, java-bindings]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Package release
        run: |
          cd release-artifacts
          zip -r liboucs-linux.zip liboucs-linux/
          zip -r liboucs-macos.zip liboucs-macos/
          zip -r liboucs-windows.zip liboucs-windows/
          zip -r oucs-wasm.zip oucs-wasm/
          zip -r oucs-java.zip oucs-java/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Python package publish (PyPI) ─────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [python-bindings]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build
          cd bindings/python
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist/
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # ── npm publish ───────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [js-wasm]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM
        uses: actions/download-artifact@v4
        with:
          name: oucs-wasm
          path: bindings/javascript/dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        run: |
          cd bindings/javascript
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
